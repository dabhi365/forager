[project]
name = "video-ingestion"
version = "0.1.0"
description = "Video Transcription with Whisper and Docling and Chunking of Videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling[asr]>=2.74.0",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
    "yt-dlp>=2026.3.17",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
